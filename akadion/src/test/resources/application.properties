spring.datasource.url=jdbc:h2:mem:akadion-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.docker.compose.enabled=false

spring.security.oauth2.client.registration.keycloak.client-id=test-client
spring.security.oauth2.client.registration.keycloak.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak-register.client-id=test-client
spring.security.oauth2.client.registration.keycloak-register.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak-admin.client-id=test-admin-client
spring.security.oauth2.client.registration.keycloak-admin.client-secret=test-admin-secret
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost/test-auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost/test-token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost/test-jwks
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost/test-userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub

app.keycloak.realm=Akadion
app.keycloak.base-url=http://localhost:8080
app.keycloak.browser-base-url=http://localhost:8080
app.frontend.base-url=http://localhost:5173

# --- MinIO & RAG ---
minio.url=http://localhost:9000
minio.access-key=mock-key
minio.secret-key=mock-secret
minio.bucket=mock-bucket
app.rag.base-url=http://localhost:8000
app.rag.embedder-url=http://localhost:8001
app.rag.auth.username=test-user
app.rag.auth.password=test-password

